<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria Fotografica</title>
    <style>
        /* Sfondo nero e impostazioni base */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #888888;
        }

        /* Contenitore verticale per le immagini */
        .gallery {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        /* Stile delle singole foto */
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <h1>ScreenHUB</h1>

    <div class="gallery">
        <!-- Aggiungi qui le tue immagini in sequenza -->
        <img src="image1.jpg" alt="Foto 1" loading="lazy">
        <img src="image2.jpg" alt="Foto 2" loading="lazy">
        <img src="image3.jpg" alt="Foto 3" loading="lazy">
        <img src="image4.jpg" alt="Foto 2" loading="lazy">
        <img src="image5.jpg" alt="Foto 2" loading="lazy">
        <img src="image6.jpg" alt="Foto 2" loading="lazy">
        <img src="image7.jpg" alt="Foto 1" loading="lazy">
        <img src="image8.jpg" alt="Foto 2" loading="lazy">
        <img src="image9.jpg" alt="Foto 3" loading="lazy">
        <img src="image10.jpg" alt="Foto 2" loading="lazy">
        <img src="image11.jpg" alt="Foto 2" loading="lazy">
        <img src="image12.jpg" alt="Foto 2" loading="lazy">
        <img src="image13.jpg" alt="Foto 1" loading="lazy">
        <img src="image14.jpg" alt="Foto 2" loading="lazy">
        <img src="image15.jpg" alt="Foto 3" loading="lazy">
        <img src="image16.jpg" alt="Foto 2" loading="lazy">
        <img src="image17.jpg" alt="Foto 2" loading="lazy">
        <img src="image18.jpg" alt="Foto 2" loading="lazy">
        <!-- Per aggiungere una nuova foto, aggiungi semplicemente
        una riga qui sotto: -->
        <!-- <img src="image4.jpg" alt="Foto 4" loading="lazy"> -->
    </div>

</body>
</html>
