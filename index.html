<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mia Galleria Fotografica</title>
    <style>
        /* Sfondo nero e stile scuro minimalista */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .gallery {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .photo-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2a2a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .interaction-panel {
            padding: 20px;
        }

        .like-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-like, .btn-dislike {
            background-color: #2a2a2a;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-like:hover { background-color: #1e3a29; color: #4eef91; }
        .btn-dislike:hover { background-color: #3a1e1e; color: #ef4e4e; }
        .btn-like:active, .btn-dislike:active { transform: scale(0.95); }

        /* Area Commenti */
        .comments-section {
            border-top: 1px solid #2a2a2a;
            padding-top: 15px;
        }

        .comments-section h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #aaa;
        }

        .comment-input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-input-group input, 
        .comment-input-group textarea {
            background: #0f0f0f;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .comment-input-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .btn-submit-comment {
            align-self: flex-end;
            background: #ffffff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .comments-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-item {
            background: #222;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .comment-item .author {
            font-weight: bold;
            color: #ddd;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <h1>Galleria Fotografica</h1>

    <div class="gallery">

        <!-- ================= FOTO 1 ================= -->
        <div class="photo-card">
            <!-- Sostituisci "image1.jpg" con il nome reale della tua immagine -->
            <img src="image1.jpg" alt="Foto 1" loading="lazy">
            
            <div class="interaction-panel">
                <div class="like-buttons">
                    <button class="btn-like" onclick="addLike(this)">👍 <span class="count">0</span></button>
                    <button class="btn-dislike" onclick="addDislike(this)">👎 <span class="count">0</span></button>
                </div>

                <div class="comments-section">
                    <h4>Commenti</h4>
                    <div class="comment-input-group">
                        <input type="text" placeholder="Il tuo nome" class="comment-author">
                        <textarea placeholder="Scrivi un commento..." class="comment-text"></textarea>
                        <button class="btn-submit-comment" onclick="postComment(this)">Invia</button>
                    </div>
                    <div class="comments-list"></div>
                </div>
            </div>
        </div>

        <!-- ================= FOTO 2 ================= -->
        <div class="photo-card">
            <img src="image2.jpg" alt="Foto 2" loading="lazy">
            
            <div class="interaction-panel">
                <div class="like-buttons">
                    <button class="btn-like" onclick="addLike(this)">👍 <span class="count">0</span></button>
                    <button class="btn-dislike" onclick="addDislike(this)">👎 <span class="count">0</span></button>
                </div>

                <div class="comments-section">
                    <h4>Commenti</h4>
                    <div class="comment-input-group">
                        <input type="text" placeholder="Il tuo nome" class="comment-author">
                        <textarea placeholder="Scrivi un commento..." class="comment-text"></textarea>
                        <button class="btn-submit-comment" onclick="postComment(this)">Invia</button>
                    </div>
                    <div class="comments-list"></div>
                </div>
            </div>
        </div>

        <!-- Aggiungi altre schede foto copiando il blocco <div class="photo-card"> ... </div> -->

    </div>

    <script>
        // Gestione Mi Piace / Non Mi Piace
        function addLike(btn) {
            let countSpan = btn.querySelector('.count');
            countSpan.textContent = parseInt(countSpan.textContent) + 1;
        }

        function addDislike(btn) {
            let countSpan = btn.querySelector('.count');
            countSpan.textContent = parseInt(countSpan.textContent) + 1;
        }

        // Gestione Commenti Locali
        function postComment(btn) {
            let panel = btn.closest('.comments-section');
            let authorInput = panel.querySelector('.comment-author');
            let textInput = panel.querySelector('.comment-text');
            let commentsList = panel.querySelector('.comments-list');

            let author = authorInput.value.trim() || "Anonimo";
            let text = textInput.value.trim();

            if (text === "") return;

            let commentDiv = document.createElement('div');
            commentDiv.className = 'comment-item';
            commentDiv.innerHTML = `<div class="author">${author}</div><div>${text}</div>`;

            commentsList.appendChild(commentDiv);

            // Reset campi
            authorInput.value = "";
            textInput.value = "";
        }
    </script>
</body>
</html>
